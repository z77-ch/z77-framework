name: Packages Split

# Splits each source directory into its own read-only repo z77-ch/<name>.
# - Push to main  -> split branch history.
# - Push a tag    -> split and propagate the tag (consumable via Composer as x.y.z).
# Requires repository secret ACCESS_TOKEN: a PAT with push rights to the target repos.
# Targets: the 18 packages under packages/ plus docs/ (published as z77/docs) — 19 split repos
# since 2026-11-20 (release 2.0.0 bauplan Phase 2, split ahead of the release commit, owner).

on:
  push:
    branches:
      - main
    tags:
      - '*'

# A branch push together with a tag push (git push --follow-tags) starts TWO
# runs that race each other into the same split repos — measured 2026-09-02:
# the tag run won, the branch run's docs push was rejected ("cannot lock ref").
# Queue the runs instead; never cancel (each must complete its propagation).
concurrency:
  group: packages-split
  cancel-in-progress: false

jobs:
  packages_split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: kernel
            directory: packages/kernel
          - package: module-frontend
            directory: packages/module-frontend
          - package: module-backend
            directory: packages/module-backend
          - package: module-dms
            directory: packages/module-dms
          - package: persistence-doctrine
            directory: packages/persistence-doctrine
          - package: module-vat
            directory: packages/module-vat
          - package: module-contact
            directory: packages/module-contact
          - package: module-mandator
            directory: packages/module-mandator
          - package: module-financial
            directory: packages/module-financial
          - package: module-article
            directory: packages/module-article
          - package: module-debtor
            directory: packages/module-debtor
          - package: module-order
            directory: packages/module-order
          - package: module-receipt
            directory: packages/module-receipt
          - package: module-mailing
            directory: packages/module-mailing
          # D1 — module-creditor ships in 2.0.0:
          - package: module-creditor
            directory: packages/module-creditor
          # D2 — module-member, module-api, kibot ship in 2.0.0:
          - package: module-member
            directory: packages/module-member
          - package: module-api
            directory: packages/module-api
          - package: kibot
            directory: packages/kibot
          - package: docs
            directory: docs

    steps:
      # The split action snapshot-copies the current package dir (no splitsh-lite),
      # so a shallow checkout of HEAD is sufficient; HEAD is needed for the commit message.
      - uses: actions/checkout@v4

      # Branch split (only on branch pushes, not on tags)
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: symplify/monorepo-split-github-action@v2.4.5
        with:
          package_directory: '${{ matrix.directory }}'
          repository_organization: 'z77-ch'
          repository_name: '${{ matrix.package }}'
          user_name: 'z77-ch'
          user_email: 'peter.ruepp@z77.ch'
          branch: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      # Tag split (only on tag pushes)
      - if: "startsWith(github.ref, 'refs/tags/')"
        uses: symplify/monorepo-split-github-action@v2.4.5
        with:
          tag: ${{ github.ref_name }}
          package_directory: '${{ matrix.directory }}'
          repository_organization: 'z77-ch'
          repository_name: '${{ matrix.package }}'
          user_name: 'z77-ch'
          user_email: 'peter.ruepp@z77.ch'
          branch: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
